name: Golden

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  regen-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail mixed src and golden artifact changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -eu
          # Three-dot against the merge base, with --no-renames. A two-dot
          # diff also lists src/ commits that landed on the base after this
          # branch point, so a golden-only PR looks mixed. --no-renames
          # keeps a moved-away src/ path; without it, git mv folds the old
          # path and the guard misses the src/ change.
          git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}" > /tmp/changed.txt
          git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}" > /tmp/pr-changed.txt
          git show "${BASE_SHA}:tests/golden/PENDING_REGEN" > /tmp/pending.base 2>/dev/null || true
          git show "${HEAD_SHA}:tests/golden/PENDING_REGEN" > /tmp/pending.head 2>/dev/null || true
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          from tests.golden._compare import pending_protocol_error
          from tests.golden._regen import regen_guard_blocks

          changed = Path("/tmp/changed.txt").read_text(encoding="utf-8").splitlines()
          labels = os.environ.get("LABELS", "").split()
          if regen_guard_blocks(changed, labels):
              sys.exit(
                  "golden-regen guard: PR touches src/ and "
                  "tests/golden/{expected,cassettes,fixtures}"
              )
          pr_paths = Path("/tmp/pr-changed.txt").read_text(encoding="utf-8").splitlines()
          message = pending_protocol_error(
              Path("/tmp/pending.base").read_text(encoding="utf-8"),
              Path("/tmp/pending.head").read_text(encoding="utf-8"),
              pr_paths,
          )
          if message:
              sys.exit(message)
          PY

  golden:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      MPLBACKEND: Agg
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      HF_HUB_OFFLINE: "1"
      LS_GOLDEN_NP_SEED: "0"
      OPENAI_API_KEY: golden-fake
      PYTHONPATH: ${{ github.workspace }}/tests/golden/_sitecustomize
      LS_GOLDEN_COMPARE_PNG: ${{ matrix.python-version == '3.12' && '1' || '0' }}
      LS_GOLDEN_ORDER_ONLY_OK: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'golden-order-only-ok')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: List PENDING cases
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          from tests.golden._compare import parse_pending_regen, pending_summary

          path = Path("tests/golden/PENDING_REGEN")
          text = path.read_text(encoding="utf-8") if path.is_file() else ""
          line = pending_summary(parse_pending_regen(text))
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(line + "\n")
          PY
      - name: DS review warning for new PENDING entries
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # Three-dot, --no-renames: additions are what this PR introduces.
          MERGE=$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")
          git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}" > /tmp/pr-changed.txt
          git show "${MERGE}:tests/golden/PENDING_REGEN" > /tmp/pending.base 2>/dev/null || true
          git show "${HEAD_SHA}:tests/golden/PENDING_REGEN" > /tmp/pending.head 2>/dev/null || true
          python3 -c 'from tests.golden._compare import publish_review_warning; publish_review_warning()'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install --user uv
      - name: Install dependencies
        run: |
          # Separate venv, no nlp-metrics extra, so nlp_without_extra can run.
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/golden-base" \
            uv sync --frozen --group dev
          echo "LS_GOLDEN_BASE_BIN=${RUNNER_TEMP}/golden-base/bin" >> "$GITHUB_ENV"
          uv sync --frozen --group dev --extra nlp-metrics
      - name: Block non-loopback egress
        run: |
          sudo iptables-save > "${RUNNER_TEMP}/iptables.golden"
          sudo ip6tables-save > "${RUNNER_TEMP}/ip6tables.golden"
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -A OUTPUT -j REJECT
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo ip6tables -A OUTPUT -j REJECT
      - name: Golden runtime dirs
        run: |
          mkdir -p "${RUNNER_TEMP}/mplconfig"
          echo "MPLCONFIGDIR=${RUNNER_TEMP}/mplconfig" >> "$GITHUB_ENV"
          echo "OPENAI_BASE_URL=http://127.0.0.1:9/v1" >> "$GITHUB_ENV"
      - name: Run golden tests
        run: uv run pytest tests/golden -m golden
      - name: Restore runner egress
        if: always()
        run: |
          # The runner reports completion on a new connection. Keep the block
          # only while the golden tests run.
          if [ -f "${RUNNER_TEMP}/iptables.golden" ]; then
            sudo iptables-restore < "${RUNNER_TEMP}/iptables.golden"
            sudo ip6tables-restore < "${RUNNER_TEMP}/ip6tables.golden"
          fi
