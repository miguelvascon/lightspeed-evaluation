[pytest]
# Pytest configuration for LightSpeed Evaluation Framework

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -m "not integration and not agentic and not golden"

# Markers
markers =
    integration: Integration tests that require real config files and external dependencies
    agentic: Agentic integration tests that require a live OpenShift cluster with agentic CRDs
    golden: Characterization tests that require the golden determinism env (run by golden.yaml)
    golden_env: Extra environment variables for one golden test (keyword arguments)
    golden_pythonpath: Extra PYTHONPATH entries prepended for one golden test (positional arguments)
    slow: Tests that are too slow for the default local selection

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Coverage options (if pytest-cov is installed)
# addopts = --cov=lightspeed_evaluation --cov-report=html --cov-report=term-missing

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:matplotlib.*
    ignore::UserWarning:seaborn.*
