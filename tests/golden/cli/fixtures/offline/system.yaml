core:
  max_threads: 1
  cache_enabled: false
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
metrics_metadata:
  turn_level:
    custom:keywords_eval:
      description: Binary keyword matching
      default: true
quality_score:
  default: true
  metrics:
  - custom:keywords_eval
storage:
- type: file
  output_dir: /tmp/golden-offline-unused
  base_filename: evaluation
  enabled_outputs:
  - csv
  - json
  - txt
  csv_columns:
  - conversation_group_id
  - turn_id
  - metric_identifier
  - score
  - threshold
  - result
  - reason
  - query
  - response
visualization:
  figsize:
  - 6
  - 4
  dpi: 100
  enabled_graphs:
  - pass_rates
  - status_breakdown
logging:
  source_level: WARNING
  package_level: WARNING
  show_timestamps: true
agents:
  enabled: false
