core:
  cache_enabled: false
  cache_base_dir: .caches
llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
logging:
  source_level: WARNING
  package_level: WARNING
agents:
  enabled: false
metrics_metadata:
  turn_level:
    custom:keywords_eval:
      description: keywords
      default: true
    custom:answer_correctness:
      description: correctness
      default: false
    ragas:context_precision:
      description: precision
      default: false
