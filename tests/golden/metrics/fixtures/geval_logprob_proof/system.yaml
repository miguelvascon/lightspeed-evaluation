# WP0c-1 GEval logprob proof (SPEC-01 §7 Q11). The GEval entries are copied
# from fixtures/judge_happy_path so the request bytes match that cassette's
# GEval exchanges. Request bytes depend on everything below: changing this file
# invalidates cassettes/geval_logprob_proof.jsonl.
core:
  max_threads: 1
  cache_enabled: false

agents:
  enabled: false

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 512
  timeout: 300
  num_retries: 3
  cache_enabled: false

embedding:
  provider: openai
  model: text-embedding-3-small
  cache_enabled: false

metrics_metadata:
  turn_level:
    "geval:technical_accuracy":
      criteria: |
        Assess whether the response provides technically accurate information,
        commands, code, syntax, and follows relevant best practices.
      evaluation_params:
        - query
        - response
        - expected_response
      threshold: 0.7
  conversation_level:
    "geval:conversation_coherence":
      criteria: |
        Evaluate whether the conversation maintains context and provides coherent
        responses across multiple turns.
      evaluation_params:
        - query
        - response
      evaluation_steps:
        - "Check if the assistant remembers information from previous turns"
        - "Verify responses build logically on previous context"
      rubrics:
        - score_range: [0, 4]
          expected_outcome: "Loses context or contradicts earlier turns."
        - score_range: [5, 10]
          expected_outcome: "Keeps context and builds on earlier turns."
      threshold: 0.6

storage:
  - type: file
    output_dir: ./eval_output
    base_filename: evaluation
    enabled_outputs: [csv, json]

visualization:
  enabled_graphs: []
